# SCHEME:
# bit 1: special case
# bit 2: should be emissive
# bit 3: should have waves
# bit 4: tbc

#Group all flat-lighting blocks together. 0b0001 #vshonly
block.1 = grass tall_grass fern large_fern wheat beetroots carrots potatoes sweet_berry_bush mushrooms kelp nether_wart tube_coral brain_coral bubble_coral fire_coral horn_coral dead_tube_coral dead_brain_coral dead_bubble_coral dead_fire_coral dead_horn_coral dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose sunflower lilac rose_bush peony seagrass sugar_cane dead_bush cobweb torch oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling

# blocks that are emissive and should be boosted (emissive) 0b0010 #both
block.2 = glowstone fire sea_lantern pearlescent_froglight verdant_froglight ochre_froglight shroomlight redstone_wire soul_fire end_rod torch wall_torch sculk_shrieker sculk_sensor sculk_sensor_phase

# blocks that are emissive and brighter parts should be boosted (partially-emissive) 0b0011 #fshonly
block.3 = magma magma_block redstone_torch redstone_wall_torch soul_torch lantern soul_lantern sculk_vein sculk sculk_catalyst soul_fire soul_campfire campfire redstone_block redstone_lamp:lit=true

# special case: lava (emissisve + waves) 0b0111
block.7 = lava flowing_lava

# blocks that are lit normally and have waves (waves) 0b0101
block.5 = water flowing_water